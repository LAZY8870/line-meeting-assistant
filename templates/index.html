<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會議小幫手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <main class="app-shell">
        <aside class="meeting-panel">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.48 3 2 6.58 2 11c0 4.08 3.62 7.5 8.5 7.98.35.04.76.16.87.36.1.18.07.47.03.66l-.15.89c-.04.27-.21 1.06.93.58 1.14-.48 6.15-3.62 8.39-6.2A7.12 7.12 0 0 0 22 11c0-4.42-4.48-8-10-8Z"/></svg>
                </div>
                <div>
                    <h1>會議小幫手</h1>
                    <p><span class="online-dot"></span> 在線中</p>
                </div>
            </div>

            <div class="draft-card">
                <div class="draft-heading">
                    <span>目前紀錄</span>
                    <button id="resetBtn" type="button">重新開始</button>
                </div>
                <div class="draft-list">
                    <div class="draft-item"><span>名稱</span><strong id="draftName">尚未填寫</strong></div>
                    <div class="draft-item"><span>時間</span><strong id="draftTime">尚未填寫</strong></div>
                    <div class="draft-item"><span>地點</span><strong id="draftLocation">尚未填寫</strong></div>
                </div>
            </div>

            <div class="history-heading"><span>已保存的會議</span><b id="meetingCount">0</b></div>
            <div id="meetingList" class="meeting-list"></div>
        </aside>

        <section class="chat-panel">
            <header class="chat-header">
                <div>
                    <p class="eyebrow">LINE 對話助理</p>
                    <h2>紀錄會議資訊</h2>
                </div>
                <button class="more-btn" type="button" aria-label="更多選項">•••</button>
            </header>

            <div id="messages" class="messages" aria-live="polite">
                <div class="message-row bot">
                    <div class="avatar">助</div>
                    <div class="bubble">你好！請告訴我會議名稱、時間與地點，三項資訊補齊後我會幫你保存。</div>
                </div>
            </div>

            <form id="chatForm" class="composer">
                <button class="add-btn" type="button" aria-label="更多功能">＋</button>
                <input id="messageInput" type="text" autocomplete="off" placeholder="輸入會議名稱、時間或地點…" aria-label="訊息">
                <button class="send-btn" type="submit" aria-label="送出">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5 21 12 3.5 3.5l.01 6.51L16 12l-12.49 1.99z"/></svg>
                </button>
            </form>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
